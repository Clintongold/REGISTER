name: Build and Deploy to GitHub Pages

# Quick way to get a live test URL before wiring up Cloudflare Pages.
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_ANON_KEY
#
# Also requires: repo Settings > Pages > Build and deployment > Source =
# "GitHub Actions" (one-time setup, no branch needed).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build (base path = repo name, for GitHub Pages project subpath)
        run: npm run build -- --base=/${{ github.event.repository.name }}/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # SPA fallback: GitHub Pages serves 404.html for unmatched paths.
      # Making it identical to index.html lets React Router take over
      # client-side on direct links/refreshes.
      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
