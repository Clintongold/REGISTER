name: Supabase Keep-Alive

# Pings the Supabase project every 4 days so it doesn't pause from the
# free-tier 7-day inactivity limit. Not needed if the project is upgraded
# to a paid plan. Requires two repo secrets:
#   SUPABASE_URL      -> e.g. https://your-project-ref.supabase.co
#   SUPABASE_ANON_KEY -> the project's anon/publishable key

on:
  schedule:
    - cron: '0 6 */4 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/companies?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
